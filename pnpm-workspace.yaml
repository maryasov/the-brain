packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 10+ blocks postinstall build scripts by default. Allow the ones we need
# (Electron binary download, better-sqlite3 native build, esbuild).
onlyBuiltDependencies:
  - electron
  - better-sqlite3
  - esbuild

# @electron/rebuild pulls node-gyp from a git URL; permit it.
blockExoticSubdeps: false

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
